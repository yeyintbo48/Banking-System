server:
  port: 8080

spring:
  application:
    name: core-banking
    
  datasource:
    url: jdbc:postgresql://localhost:5433/banking_db
    username: bank_admin
    password: postgres455
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migration: true
    locations: classpath:db/migration

  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false